name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build extension
        run: mvn -B clean package

      - uses: actions/upload-artifact@v7
        with:
          name: oie-message-inspector
          path: message-inspector-plugin/target/oie-message-inspector-*.zip
          if-no-files-found: error
