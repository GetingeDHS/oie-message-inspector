name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build extension with version from tag
        run: mvn -B clean package -Drevision="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Supported OIE versions come from the same POM property that feeds plugin.xml
          versions=$(sed -n 's:.*<oie.compatibleVersions>\(.*\)</oie.compatibleVersions>.*:\1:p' pom.xml)
          if [ -z "$versions" ]; then
            echo "::error::oie.compatibleVersions not found in pom.xml"
            exit 1
          fi
          notes=$(printf '%s\n\n%s\n%s\n%s\n' \
            "**Compatible with OIE ${versions}**" \
            "1. Download the ZIP below and extract it into the OIE \`extensions/\` directory" \
            "2. Restart the OIE server" \
            "3. Open \"Message Inspector\" in the Web Client")
          gh release create "$GITHUB_REF_NAME" \
            message-inspector-plugin/target/oie-message-inspector-*.zip \
            --title "Message Inspector ${GITHUB_REF_NAME#v}" \
            --notes "$notes" \
            --generate-notes
